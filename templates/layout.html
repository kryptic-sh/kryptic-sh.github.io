<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="{{accent}}" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="keywords" content="{{keywords}}" />
    <link rel="canonical" href="{{canonical}}" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:site_name" content="kryptic.sh" />
    <meta property="og:image" content="https://www.kryptic.sh{{og_image}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{title}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="https://www.kryptic.sh{{og_image}}" />
    <link rel="icon" type="image/svg+xml" href="{{favicon_base}}favicon.svg" />
    <link
      rel="alternate icon"
      type="image/x-icon"
      href="{{favicon_base}}favicon.ico"
    />
    <link rel="apple-touch-icon" href="{{favicon_base}}apple-touch-icon.png" />
    <link rel="manifest" href="{{favicon_base}}manifest.json" />
    <script type="application/ld+json">
      {{jsonld}}
    </script>
    <link rel="stylesheet" href="/assets/css/base.css" />
    <script src="/assets/js/site.js" defer></script>
    {{head_extra}}
  </head>
  <body>
    <nav class="siblings">
      <div class="siblings-inner">{{siblings}}</div>
    </nav>

    <nav class="top">
      <div class="brand">{{brand}}</div>
      <div class="links">{{nav_links}}</div>
    </nav>

    <main class="wrap">{{content}}</main>

    <footer>
      <div class="wrap footer-inner">
        <div>kryptic.sh · MIT · built in Rust</div>
        <div>{{footer_links}}</div>
      </div>
    </footer>
  </body>
</html>
