name: Pages

# GitHub Pages deploy for the unified kryptic.sh site. Every project page
# lives under /<app>/ on this domain (no more per-app subdomain sites).
# Pages are assembled from templates/ + content/ by build.py (stdlib-only
# Python). App versions are no longer baked at build time — each page
# fetches the latest release tag client-side from the GitHub API
# (assets/js/site.js), so no cron rebuild is needed.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'assets/**'
      - 'public/**'
      - 'build.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'templates/**'
      - 'assets/**'
      - 'public/**'
      - 'build.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: python3 build.py

      - name: Sanity-check output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/.nojekyll
          test -f dist/assets/css/base.css
          test -f dist/assets/js/site.js
          for app in sqeel buffr hjkl inbx hodl pikr gpur hrdr infr; do
            test -f "dist/$app/index.html" || { echo "::error::missing dist/$app/index.html"; exit 1; }
          done
          if grep -rn '{{' dist --include='*.html'; then
            echo "::error::unsubstituted template vars in dist/"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
