name: Pages

# GitHub Pages deploy for the unified kryptic.sh site. Every project page
# lives under /<app>/ on this domain (no more per-app subdomain sites).
# Pages are assembled from templates/ + content/ by build.py (stdlib-only
# Python). App versions are no longer baked at build time — each page
# fetches the latest release tag client-side from the GitHub API
# (assets/js/site.js), so no version-cron is needed.
#
# buffr's mdBook docs are also served here, at /buffr/docs/: the build
# checks out kryptic-sh/buffr and runs `mdbook build` against its
# docs/ + book.toml. The daily cron picks up docs edits made in the
# buffr repo without a commit here.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'assets/**'
      - 'public/**'
      - 'build.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'templates/**'
      - 'assets/**'
      - 'public/**'
      - 'build.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: python3 build.py

      - name: Check out buffr (docs source)
        uses: actions/checkout@v6
        with:
          repository: kryptic-sh/buffr
          path: _buffr

      - name: Install mdBook
        run: |
          set -euo pipefail
          version="0.4.40"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${version}/mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build buffr docs into /buffr/docs/
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r path; do
            if [ -n "$path" ] && [ ! -f "_buffr/docs/$path" ]; then
              echo "::error::SUMMARY.md references missing file: docs/$path"
              missing=1
            fi
          done < <(grep -oE '\(\./[^)]+\)' _buffr/docs/SUMMARY.md | sed 's/(\.\///;s/)$//')
          test "$missing" -eq 0
          mdbook build _buffr
          mkdir -p dist/buffr/docs
          cp -a _buffr/docs-site/. dist/buffr/docs/

      - name: Sanity-check output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/.nojekyll
          test -f dist/assets/css/base.css
          test -f dist/assets/js/site.js
          for app in sqeel buffr hjkl inbx hodl pikr gpur hrdr infr; do
            test -f "dist/$app/index.html" || { echo "::error::missing dist/$app/index.html"; exit 1; }
          done
          test -f dist/buffr/docs/index.html
          if grep -rn '{{' dist --include='*.html'; then
            echo "::error::unsubstituted template vars in dist/"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
