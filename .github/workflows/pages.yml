name: Pages

# GitHub Pages deploy for the kryptic.sh site. Project *pages* live under
# /<app>/ on this domain; project *artifacts* that need a real build
# pipeline get their own subdomain and publish from their own repo.
# Pages are assembled from templates/ + content/ by build.py (stdlib-only
# Python). App versions are no longer baked at build time — each page
# fetches the latest release tag client-side from the GitHub API
# (assets/js/site.js), so no version-cron is needed.
#
# This workflow has no cross-repo dependencies. It used to build buffr's
# mdBook docs by checking that repo out, which meant a broken SUMMARY.md
# link there failed *this* deploy, and docs edits only went live on a daily
# cron here. buffr now publishes its own book to buffr.kryptic.sh, and
# crcbl its demos to crcbl.kryptic.sh — both keep the build next to the
# code, and this site is prose again. /buffr/docs/ redirects out.

on:
  # No schedule: the daily cron existed only to pick up buffr docs edits made
  # without a commit here, and those are published from the buffr repo now.
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'assets/**'
      - 'public/**'
      - 'build.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'templates/**'
      - 'assets/**'
      - 'public/**'
      - 'build.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: python3 build.py

      - name: Sanity-check output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/.nojekyll
          test -f dist/assets/css/base.css
          test -f dist/assets/js/site.js
          for app in sqeel buffr hjkl inbx hodl pikr gpur crcbl hrdr infr krypt; do
            test -f "dist/projects/$app/index.html" || { echo "::error::missing dist/projects/$app/index.html"; exit 1; }
          done
          if grep -rn '{{' dist --include='*.html'; then
            echo "::error::unsubstituted template vars in dist/"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
